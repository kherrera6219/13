[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "dle-middleware"
version = "0.1.0"
description = "DataLogicEngine 13-axis DVSS middleware with a Gemini-compatible API"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sse-starlette>=2.1,<3",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "google-genai>=1.0,<4",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
  "cryptography>=50,<52",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "onnxruntime>=1.19,<2",
  "sqlite-vec>=0.1.6,<1",
  "structlog>=24.4,<26",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=5.0,<8",
  "hypothesis>=6.112,<7",
  "mutmut>=3.2,<4; sys_platform != 'win32'",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
  "types-jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<1",
  "pip-audit>=2.7,<3",
  "cyclonedx-bom>=5.1,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["dle"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN", "D", "SIM", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["dle"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the real Gemini API; nightly only",
  "slow: longer than 10 s",
]
addopts = "--import-mode=importlib -m 'not live' --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 85
show_missing = true
