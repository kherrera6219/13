# Tier table (paper §07, §12b; FR-TIER-01–04). The only place that sets depth. Major config change: AI risk owner approval.
schema_version: 1.0.0
s_eff: "max(S, 3B, 6Z)"   # S = D + R + M; B = binding predicate or R >= 2; Z = failure-centroid hit
tiers:
  - tier: 1
    s_eff: [0, 2]
    roles: [scholar]
    starting_hops: 1
    max_retries: 2
    max_hops: 4
    escalation: once_on_binding_claim     # recompute S_eff with B = 1
    max_model_calls: 9
    max_model_calls_escalated: 21
  - tier: 2
    s_eff: [3, 5]
    roles: [scholar, practitioner]
    on_demand: { regulator: binding_claim, harmonizer: axis7_entry }
    starting_hops: 2
    max_retries: 2
    max_hops: 4
    escalation: once_on_binding_claim_without_regulator
    max_model_calls: 18
    max_model_calls_escalated: 22
  - tier: 3
    s_eff: [6, 9]
    roles: all_when_b_or_z_else_relevant
    starting_hops: 2
    max_retries: 2
    max_hops: 4
    escalation: none
    max_model_calls: 18
graph_limits: { max_vertices: 250, ppr_damping: 0.85, ppr_max_iterations: 80, ppr_tolerance: 1.76e-6 }
# Graph distance weights for d(i,j) = d_tree(i,j) + w3*honeycomb_hops + w67*crosswalk_cost (DLE-SPC-003 §5). Both > 0.
distance_weights: { w3: 1.0, w67: 1.0 }
